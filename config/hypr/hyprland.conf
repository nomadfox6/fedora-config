##############################################
# Hyprland config
##############################################

# ── Plugins ──────────────────────────────────
# (hyprpm loads enabled plugins automatically at startup)

# ── Monitors ─────────────────────────────────
monitor=,preferred,auto,1
source = /home/nate/.config/hypr/monitors.conf

# ── Environment ──────────────────────────────
env = WLR_NO_HARDWARE_CURSORS,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = SSH_AUTH_SOCK,/run/user/1000/keyring/ssh
env = GI_TYPELIB_PATH,/usr/local/lib64/girepository-1.0:/usr/lib64/girepository-1.0
env = LD_LIBRARY_PATH,/usr/local/lib64:/usr/lib64

# ── Autostart ────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11
exec-once = dbus-update-activation-environment --systemd SSH_AUTH_SOCK
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = dunst
exec-once = ags run ~/.config/ags/app.tsx
exec-once = hypridle
exec-once = cursor-clip --daemon
exec-once = swww-daemon
exec-once = waypaper --restore
exec-once = bash ~/.config/hypr/urgent-notify.sh

# ── Input ────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# ── General ──────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(88c0d0ff) rgba(81a1c1ff) 45deg
    col.inactive_border = rgba(3b4252ff)
    layout = dwindle
}

# ── Decoration ───────────────────────────────
decoration {
    rounding = 6

    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

# ── Animations ───────────────────────────────
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows,     1, 5,  myBezier
    animation = windowsOut,  1, 5,  default, popin 80%
    animation = border,      1, 8,  default
    animation = fade,        1, 6,  default
    animation = workspaces,  1, 5,  default
}

# ── Layout: Dwindle ──────────────────────────
dwindle {
    pseudotile = false
    preserve_split = true
}

# ── Misc ─────────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

##############################################
# Keybinds
##############################################

$mod = SUPER

# Terminals
bind = $mod, T,          exec, foot
bind = $mod, Return,     exec, foot

# Browser
bind = $mod, W,          exec, firefox

# File manager
bind = $mod, F,          exec, nautilus

# Screen lock
bind = $mod, L,          exec, hyprlock

# Launcher
bind = $mod, apostrophe,   exec, wofi --show drun
bind = , XF86Favorites, exec, wofi --show drun

# AGS panel
bind = $mod, Tab,        exec, ags toggle my-panel
bind = $mod, grave,      exec, hyprctl dispatch hyprws toggle

# Close window
bind = $mod, Q,          killactive

# Fullscreen
bind = $mod, Space,      fullscreen, 0

# Reload config
bind = $mod SHIFT, R,    exec, hyprctl reload

# Screenshot → Gradia
bind = , Print,          exec, grim - | flatpak run be.alexandervanhee.gradia

# Clipboard
bind = $mod, V,          exec, cursor-clip

# Split preselection
bind = $mod SHIFT, V,    layoutmsg, preselect r
bind = $mod, H,          layoutmsg, preselect d

# Move windows
bind = $mod, left,       movewindow, l
bind = $mod, right,      movewindow, r
bind = $mod, up,         movewindow, u
bind = $mod, down,       movewindow, d

# Switch workspaces
bind = $mod, 1,          exec, hyprctl dispatch workspace 1 && notify-send -t 1500 -h string:x-dunst-stack-tag:workspace "Workspace 1" ""
bind = $mod, 2,          exec, hyprctl dispatch workspace 2 && notify-send -t 1500 -h string:x-dunst-stack-tag:workspace "Workspace 2" ""
bind = $mod, 3,          exec, hyprctl dispatch workspace 3 && notify-send -t 1500 -h string:x-dunst-stack-tag:workspace "Workspace 3" ""
bind = $mod, 4,          exec, hyprctl dispatch workspace 4 && notify-send -t 1500 -h string:x-dunst-stack-tag:workspace "Workspace 4" ""
bind = $mod, 5,          exec, hyprctl dispatch workspace 5 && notify-send -t 1500 -h string:x-dunst-stack-tag:workspace "Workspace 5" ""
bind = $mod, 6,          exec, hyprctl dispatch workspace 6 && notify-send -t 1500 -h string:x-dunst-stack-tag:workspace "Workspace 6" ""
bind = $mod, 7,          exec, hyprctl dispatch workspace 7 && notify-send -t 1500 -h string:x-dunst-stack-tag:workspace "Workspace 7" ""
bind = $mod, 8,          exec, hyprctl dispatch workspace 8 && notify-send -t 1500 -h string:x-dunst-stack-tag:workspace "Workspace 8" ""
bind = $mod, 9,          exec, hyprctl dispatch workspace 9 && notify-send -t 1500 -h string:x-dunst-stack-tag:workspace "Workspace 9" ""
bind = $mod, 0,          exec, hyprctl dispatch workspace 10 && notify-send -t 1500 -h string:x-dunst-stack-tag:workspace "Workspace 10" ""

# Move active window to workspace
bind = $mod SHIFT, 1,    movetoworkspace, 1
bind = $mod SHIFT, 2,    movetoworkspace, 2
bind = $mod SHIFT, 3,    movetoworkspace, 3
bind = $mod SHIFT, 4,    movetoworkspace, 4
bind = $mod SHIFT, 5,    movetoworkspace, 5
bind = $mod SHIFT, 6,    movetoworkspace, 6
bind = $mod SHIFT, 7,    movetoworkspace, 7
bind = $mod SHIFT, 8,    movetoworkspace, 8
bind = $mod SHIFT, 9,    movetoworkspace, 9
bind = $mod SHIFT, 0,    movetoworkspace, 10

# Mouse binds
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Function / Media Keys ────────────────────

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && notify-send -t 1500 -h string:x-dunst-stack-tag:osd -h int:value:$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}') "Volume" ""
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && notify-send -t 1500 -h string:x-dunst-stack-tag:osd -h int:value:$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}') "Volume" ""
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && notify-send -t 1500 -h string:x-dunst-stack-tag:osd "Volume" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | grep -q MUTED && echo Muted || echo Unmuted)"

# Brightness
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+ && notify-send -t 1500 -h string:x-dunst-stack-tag:osd_brightness -h int:value:$(brightnessctl -m | cut -d, -f4 | tr -d '%') "Brightness" ""
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && notify-send -t 1500 -h string:x-dunst-stack-tag:osd_brightness -h int:value:$(brightnessctl -m | cut -d, -f4 | tr -d '%') "Brightness" ""

