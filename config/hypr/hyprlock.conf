##############################################
# Hyprlock config — Nord theme
##############################################

general {
    hide_cursor         = true
}

background {
    monitor     =
    color       = rgba(2e3440ff)
    blur_passes = 2
    blur_size   = 6
}

# Clock (top-center)
label {
    monitor     =
    text        = $TIME
    color       = rgba(d8dee9ff)
    font_size   = 72
    font_family = JetBrains Mono Bold
    position    = 0, -80
    halign      = center
    valign      = top
}

# Date (below clock)
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %B %-d"
    color       = rgba(88c0d0ff)
    font_size   = 22
    font_family = JetBrains Mono
    position    = 0, -175
    halign      = center
    valign      = top
}

# Password input (center)
input-field {
    monitor           =
    size              = 300, 50
    outline_thickness = 2
    dots_size         = 0.28
    dots_spacing      = 0.15
    outer_color       = rgba(88c0d0ff)
    inner_color       = rgba(3b4252ff)
    font_color        = rgba(d8dee9ff)
    font_family       = JetBrains Mono
    fade_on_empty     = true
    placeholder_text  = <i>Password...</i>
    fail_text         = <i>$PAMFAIL</i>
    hide_input        = false
    rounding          = 6
    position          = 0, 0
    halign            = center
    valign            = center
}
